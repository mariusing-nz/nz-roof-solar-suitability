[project]
name = "nz-roof-solar-suitability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.5", "httpx>=0.27", "shapely>=2.0", "pyproj>=3.6", "numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
